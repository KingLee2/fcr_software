controller_server:
  ros__parameters:
    controller_frequency: 20.0 #10.0
    publish_zero_velocity: True
    #costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    speed_limit_topic: /$(var mvibot_seri)/speed_limit
    odom_topic: "/odometry/filtered"
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25    #Minimum amount a robot must move to be progressing to goal (m).
      movement_time_allowance: 10.0

    #goal checker parameters
    goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      lookahead_dist: 1.0 #0.6
      min_lookahead_dist: 0.5 #0.7
      max_lookahead_dist: 1.5 #0.9
      lookahead_time: 2.5 #1.5 #2.0
      rotate_to_heading_angular_vel: 1.8
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.00
      approach_velocity_scaling_dist: 1.0 #0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.5 #2.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: true #false
      cost_scaling_dist: 0.5 #1.0 #0.6 #add
      cost_scaling_gain: 0.2 #add #0.8
      regulated_linear_scaling_min_radius: 2.0
      regulated_linear_scaling_min_speed: 0.1 #0.15 #0.25
      use_rotate_to_heading: true #false  # allows to follow coverage path better in sharper turns
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 50.0 #10.0
      use_interpolation: true
